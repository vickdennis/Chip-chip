<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #333; }
  
  .nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 80px;
    background: white;
  }

  .indicator {
    position: absolute;
    top: -24px;
    left: 20px; /* will slide */
    width: 60px;
    height: 60px;
    background: #333; /* match body background */
    border-radius: 50%;
  }

  .indicator::before {
    content: '';
    position: absolute;
    top: 24px;
    left: -24px;
    width: 24px;
    height: 24px;
    background: transparent;
    border-top-right-radius: 24px;
    box-shadow: 10px -10px 0 0 white; /* wait, need to match nav bar bg */
  }

  .indicator::after {
    content: '';
    position: absolute;
    top: 24px;
    right: -24px;
    width: 24px;
    height: 24px;
    background: transparent;
    border-top-left-radius: 24px;
    box-shadow: -10px -10px 0 0 white; /* wait, need to match nav bar bg */
  }
  
  .circle {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 48px;
    height: 48px;
    background: black;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="nav-bar">
    <div class="indicator">
      <div class="circle"></div>
    </div>
  </div>
</body>
</html>
